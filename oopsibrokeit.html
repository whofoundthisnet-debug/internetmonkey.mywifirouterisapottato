<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops, I Broke It</title>

    <style>
        body {
            margin: 0;
            background: #1b1b1b;
            font-family: monospace;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            background:
                repeating-linear-gradient(
                    0deg,
                    #242424 0px,
                    #242424 8px,
                    #202020 8px,
                    #202020 16px
                );
        }

        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            letter-spacing: 2px;
        }

        #hand {
            position: absolute;
            font-size: 32px;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <div id="game">
        <div id="title">OOPS, I BROKE IT</div>

        <div id="hand">🖐️</div>
    </div>

    <script>
        const hand = document.getElementById("hand");

        document.addEventListener("mousemove", function(event) {
            hand.style.left = event.clientX + "px";
            hand.style.top = event.clientY + "px";
        });
    </script>

</body>
</html>
