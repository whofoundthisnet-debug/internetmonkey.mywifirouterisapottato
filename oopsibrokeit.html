<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops, I Broke It</title>

    <style>
        body {
            margin: 0;
            background: #1b1b1b;
            font-family: monospace;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            background:
                repeating-linear-gradient(
                    0deg,
                    #242424 0px,
                    #242424 8px,
                    #202020 8px,
                    #202020 16px
                );
        }

        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            letter-spacing: 2px;
        }

      #hand {
    position: absolute;
    width: 240px;
    height: 240px;

    display: grid;
    grid-template-columns: repeat(30, 8px);
    grid-template-rows: repeat(30, 8px);

    pointer-events: none;
    transform: translate(-50%, -50%);
}

.pixel {
    width: 8px;
    height: 8px;
    font-size: 8px;
    line-height: 8px;
    overflow: hidden;
}
    </style>
</head>

<body>

    <div id="game">
        <div id="title">OOPS, I BROKE IT</div>

     <div id="hand"></div>
    </div>

    <script>
      <script>
    const hand = document.getElementById("hand");

    const handPattern = [
        "..............................",
        "..............................",
        "..................KK..........",
        "..................KK..........",
        "..................KK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK..........",
        ".................KKK.........."
    ];

    for (const row of handPattern) {
        for (const pixelType of row) {
            const pixel = document.createElement("div");
            pixel.className = "pixel";

            if (pixelType === "K") {
                pixel.textContent = "⬛";
            }

            hand.appendChild(pixel);
        }
    }

    document.addEventListener("mousemove", function(event) {
        hand.style.left = event.clientX + "px";
        hand.style.top = event.clientY + "px";
    });
</script>
    </script>

</body>
</html>
