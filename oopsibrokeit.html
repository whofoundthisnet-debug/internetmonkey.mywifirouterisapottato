<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops, I Broke It</title>

    <style>
        body {
            margin: 0;
            background: #1b1b1b;
            font-family: monospace;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            background:
                repeating-linear-gradient(
                    0deg,
                    #242424 0px,
                    #242424 8px,
                    #202020 8px,
                    #202020 16px
                );
        }

        #title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            letter-spacing: 2px;
        }

      #hand {
    position: absolute;
    width: 240px;
    height: 240px;

    display: grid;
    grid-template-columns: repeat(30, 4px);
    grid-template-rows: repeat(30, 4px);

    pointer-events: none;
    transform: translate(-50%, -50%);
}

.pixel {
    width: 4px;
    height: 4px;
    font-size: 4px;
    line-height: 4px;
    overflow: hidden;
}
    </style>
</head>

<body>

    <div id="game">
        <div id="title">OOPS, I BROKE IT</div>

     <div id="hand"></div>
    </div>

    <script>
   const hand = document.getElementById("hand");

const handPattern = [
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "...........KK................",
    "...........KSSK..............",
    "...........KSSK..............",
    "...........KSSK..............",
    "...........KSSK..............",
    ".........KKSSSK..............",
    "........KSSSSSSSK............",
    ".......KSSSSSSSSSK...........",
    ".......KSSSSSSSSSK...........",
    "........KSSSSSSSK...........",
    ".........KKKKKKK.............",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    "..............................",
    ".............................."
];

hand.innerHTML = "";

handPattern.forEach(row => {
    [...row].forEach(type => {
        const pixel = document.createElement("span");

        pixel.className = "pixel";

        if (type === "K") {
            pixel.textContent = "⬛";
        }

        hand.appendChild(pixel);
    });
});

const maxReach = 500;

function moveHand(event) {

    const mouseX = event.clientX;
    const mouseY = event.clientY;

    const startX = window.innerWidth - 80;
    const startY = window.innerHeight - 80;

    const dx = mouseX - startX;
    const dy = mouseY - startY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    let handX = mouseX;
    let handY = mouseY;

    if (distance > maxReach) {
        const angle = Math.atan2(dy, dx);

        handX = startX + Math.cos(angle) * maxReach;
        handY = startY + Math.sin(angle) * maxReach;
    }

    hand.style.left = handX + "px";
    hand.style.top = handY + "px";
}

hand.style.left = (window.innerWidth - 80) + "px";
hand.style.top = (window.innerHeight - 80) + "px";

document.addEventListener("mousemove", moveHand);
    </script>

</body>
</html>
